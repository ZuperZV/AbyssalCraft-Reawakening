plugins {
    id 'multiloader-common'
}

configurations {
    commonJava{
        canBeResolved = true
    }
    commonResources{
        canBeResolved = true
    }
}

dependencies {
    compileOnly(project(':common')) {
        def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')
}

tasks.named('compileJava', JavaCompile) {
    dependsOn project(':common').tasks.named('classes')
}

// The loader launchers expose only their own source-set output as the mod root.
// Put the already compiled common classes there so mixins and common code are
// visible to both the development launcher and the packaged loader mod.
def syncCommonClasses = tasks.register('syncCommonClasses', Copy) {
    dependsOn project(':common').tasks.named('classes')
    dependsOn tasks.named('compileJava')
    from project(':common').sourceSets.main.output.classesDirs
    into sourceSets.main.output.classesDirs.singleFile
}

tasks.named('classes') {
    dependsOn syncCommonClasses
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

tasks.named('javadoc', Javadoc).configure {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}
